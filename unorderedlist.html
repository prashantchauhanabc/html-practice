<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <ul> 
        <li><h2>want to buy</h2></li>
        <li>peanut butter</li>
        <li>banana</li>
        <li>pomegranate</li>
        <li>samosa</li>
    </ul>
    <ol type="a">
        <li>peanut butter</li>
        <li>banana</li>
        <li>pomegranate</li>
        <li>samosa</li>
    </ol>
    
</body>
</html>
